databaseChangeLog:
  - changeSet:
      id: 5-create-orders-table
      author: student
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: order_date
                  type: datetime
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
        - createTable:
            tableName: orders_tickets
            columns:
              - column:
                  name: order_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: ticket_id
                  type: BIGINT
                  constraints:
                    nullable: false